name: Verify

# One run per main commit, pull request or candidate dispatch. Structural
# checks run once. Four file shards each run Base verification, build,
# typecheck, email-link and hosted-output checks; together they run every
# Blotter journey within the unchanged 15-minute job limit.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      CI: 'true'
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22.20.0'
          package-manager-cache: false
      - run: npm install --global pnpm@10.12.4
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec rer check --profile first-party
      - run: pnpm run typecheck
      - run: pnpm exec rer build --site

  verify:
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      BLOTTER_TEST_SHARD: ${{ matrix.shard }}/4
      CI: 'true'
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22.20.0'
          package-manager-cache: false
      - run: npm install --global pnpm@10.12.4
      - run: pnpm install --frozen-lockfile
      - run: pnpm run deps
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm run verify
