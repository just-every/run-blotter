name: Verify

# Candidate pushes run the full wall. Green push evidence lets main, duplicate
# PRs and exact-tree pushes reuse it. Build and shared checks run once; Blotter
# file shards consume the same emitted Worker.
on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      tier:
        type: string
        default: push
      timeout:
        type: number
        default: 15

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref == 'refs/heads/main' && github.run_id || github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  plan:
    runs-on: ubuntu-24.04
    timeout-minutes: 1
    permissions:
      contents: read
      actions: read
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      skip: ${{ steps.plan.outputs.skip }}
      coverage: ${{ steps.plan.outputs.coverage }}
      tier: ${{ steps.plan.outputs.tier }}
      readers: ${{ steps.plan.outputs.readers }}
      has_shards: ${{ steps.plan.outputs.has_shards }}
      has_checks: ${{ steps.plan.outputs.has_checks }}
      has_nightly: ${{ steps.plan.outputs.has_nightly }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Check reusable workflow permissions
        run: node scripts/verify-ci.mjs --check-workflows
      - name: Look up complete nightly marker
        id: nightly
        if: ${{ github.event_name == 'schedule' || inputs.tier == 'nightly' }}
        uses: actions/cache/restore@5a3ec84eff668545956fd18022155c47e93e2684
        with:
          path: ${{ runner.temp }}/nightly-green
          key: nightly-green-${{ github.sha }}
          lookup-only: true
      - id: plan
        env:
          TIER: ${{ inputs.tier || 'push' }}
          GITHUB_TOKEN: ${{ github.token }}
          NIGHTLY_CACHE_HIT: ${{ steps.nightly.outputs.cache-hit }}
        run: node scripts/ci/verification.mjs --plan

  checks:
    name: shards (checks)
    needs: plan
    if: needs.plan.outputs.has_checks == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: ${{ inputs.timeout || 15 }}
    env:
      CI: 'true'
      WRANGLER_SEND_METRICS: 'false'
      PLAYWRIGHT_SKIP_BROWSER_GC: '1'
    steps:
      - name: Set runner-owned browser cache
        run: printf 'PLAYWRIGHT_BROWSERS_PATH=%s/ms-playwright\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22.20.0'
          package-manager-cache: false
      - run: npm install --global pnpm@10.12.4
      - run: pnpm config set store-dir "$RUNNER_TEMP/pnpm-store"
      - name: Prepare runner-owned browser and apt caches
        run: mkdir -p "$PLAYWRIGHT_BROWSERS_PATH" "$RUNNER_TEMP/rer-apt/archives"
      - name: Cache frozen dependencies and Chromium
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684
        with:
          path: |
            ${{ runner.temp }}/pnpm-store
            ${{ runner.temp }}/ms-playwright
            ${{ runner.temp }}/rer-apt/archives/*.deb
          key: blotter-ubuntu24-temp-store-${{ runner.arch }}-${{ hashFiles('pnpm-lock.yaml', 'package.json') }}
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec rer check --profile first-party
      - run: node scripts/contract-docs.mjs check
      - run: pnpm run typecheck
      - name: Check edition source lock freshness
        run: node scripts/edition-authoring/cli.mjs check
      - run: pnpm run build
      - name: Install and probe Chromium before system dependencies
        run: |
          set -euo pipefail
          pnpm exec playwright install chromium
          probe() { node scripts/ci/chromium-probe.mjs; }
          if probe; then
            :
          else
            status=$?
            if [ "$status" -eq 77 ]; then exit "$status"; fi
            sudo env "PATH=$PATH" "APT_ARCHIVES=$RUNNER_TEMP/rer-apt/archives" python3 scripts/install-chromium-deps.py
            probe
          fi
      - run: pnpm run test:email-link
      # This unchanged test builds the run site itself.
      - run: pnpm run test:site
      - name: Verify hosted output and hydration
        run: pnpm exec rer queue verify:hosted -- node scripts/ci/hosted-checks.mjs
      - name: Verify the native agent door
        run: node node_modules/@runeditrun/rer/cli/agent-door.mjs . deploy.json
      - name: Pack the shared Worker build
        run: tar -czf "$RUNNER_TEMP/verify-build.tgz" dist/server dist/client
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: verify-build
          path: ${{ runner.temp }}/verify-build.tgz
          if-no-files-found: error
          retention-days: 1

  shards:
    name: shards (${{ matrix.name }})
    needs: [plan, checks]
    if: needs.plan.outputs.has_shards == 'true'
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    runs-on: ubuntu-24.04
    timeout-minutes: ${{ inputs.timeout || 15 }}
    env:
      BLOTTER_TEST_SHARD: ${{ matrix.partition }}
      CI: 'true'
      WRANGLER_SEND_METRICS: 'false'
      PLAYWRIGHT_SKIP_BROWSER_GC: '1'
    steps:
      - name: Set runner-owned browser cache
        run: printf 'PLAYWRIGHT_BROWSERS_PATH=%s/ms-playwright\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22.20.0'
          package-manager-cache: false
      - run: npm install --global pnpm@10.12.4
      - run: pnpm config set store-dir "$RUNNER_TEMP/pnpm-store"
      - name: Prepare runner-owned browser and apt caches
        run: mkdir -p "$PLAYWRIGHT_BROWSERS_PATH" "$RUNNER_TEMP/rer-apt/archives"
      - name: Cache frozen dependencies and Chromium
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684
        with:
          path: |
            ${{ runner.temp }}/pnpm-store
            ${{ runner.temp }}/ms-playwright
            ${{ runner.temp }}/rer-apt/archives/*.deb
          key: blotter-ubuntu24-temp-store-${{ runner.arch }}-${{ hashFiles('pnpm-lock.yaml', 'package.json') }}
      - run: pnpm install --frozen-lockfile
      - name: Install and probe Chromium before system dependencies
        run: |
          set -euo pipefail
          pnpm exec playwright install chromium
          probe() { node scripts/ci/chromium-probe.mjs; }
          if probe; then
            :
          else
            status=$?
            if [ "$status" -eq 77 ]; then exit "$status"; fi
            sudo env "PATH=$PATH" "APT_ARCHIVES=$RUNNER_TEMP/rer-apt/archives" python3 scripts/install-chromium-deps.py
            probe
          fi
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: verify-build
          path: ${{ runner.temp }}
      - name: Unpack the shared Worker build
        run: tar -xzf "$RUNNER_TEMP/verify-build.tgz"
      - run: pnpm run test:blotter

  light:
    needs: plan
    if: ${{ needs.plan.outputs.coverage == 'light' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      CI: 'true'
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '22.20.0'
          package-manager-cache: false
      - run: npm install --global pnpm@10.12.4
      - run: pnpm config set store-dir "$RUNNER_TEMP/pnpm-store"
      - uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684
        with:
          path: ${{ runner.temp }}/pnpm-store
          key: blotter-ubuntu24-light-store-${{ runner.arch }}-${{ hashFiles('pnpm-lock.yaml', 'package.json') }}
      - run: pnpm install --frozen-lockfile
      - name: Run the changed files' reviewed readers and build the run site
        env:
          LIGHT_READERS: ${{ needs.plan.outputs.readers }}
        run: node scripts/ci/verification.mjs --light

  full-push-proof:
    needs: [plan, checks, shards]
    if: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/heads/') && needs.plan.outputs.tier == 'push' && needs.plan.outputs.coverage == 'full' && needs.checks.result == 'success' && needs.shards.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 1
    steps:
      - run: test '${{ needs.checks.result }}' = success && test '${{ needs.shards.result }}' = success

  nightly-proof:
    needs: [plan, checks, shards]
    if: ${{ needs.plan.outputs.has_nightly == 'true' && github.ref == 'refs/heads/main' && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && (needs.plan.outputs.tier == 'nightly' || needs.plan.outputs.tier == 'all') && needs.plan.outputs.coverage == 'full' && needs.shards.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 1
    steps:
      - name: Mark successful complete nightly coverage
        run: mkdir -p "$RUNNER_TEMP/nightly-green" && printf '%s\n' '${{ github.sha }}' > "$RUNNER_TEMP/nightly-green/sha"
      - uses: actions/cache/save@5a3ec84eff668545956fd18022155c47e93e2684
        with:
          path: ${{ runner.temp }}/nightly-green
          key: nightly-green-${{ github.sha }}

  verify:
    needs: [plan, checks, shards, light, full-push-proof, nightly-proof]
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 1
    steps:
      - name: Require the selected coverage and its proof
        env:
          PLAN: ${{ needs.plan.result }}
          CHECKS: ${{ needs.checks.result }}
          HAS_CHECKS: ${{ needs.plan.outputs.has_checks }}
          REQUIRE_PUSH_PROOF: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/heads/') && needs.plan.outputs.tier == 'push' && needs.plan.outputs.coverage == 'full' }}
          SHARDS: ${{ needs.shards.result }}
          LIGHT: ${{ needs.light.result }}
          PUSH_PROOF: ${{ needs.full-push-proof.result }}
          NIGHTLY_PROOF: ${{ needs.nightly-proof.result }}
          COVERAGE: ${{ needs.plan.outputs.coverage }}
          HAS_SHARDS: ${{ needs.plan.outputs.has_shards }}
          SKIP: ${{ needs.plan.outputs.skip }}
        run: |
          set -euo pipefail
          test "$PLAN" = success
          if [ "$HAS_CHECKS" = true ]; then test "$CHECKS" = success; else test "$CHECKS" = skipped; fi
          if [ "$REQUIRE_PUSH_PROOF" = true ]; then test "$PUSH_PROOF" = success; fi
          case "$PUSH_PROOF:$NIGHTLY_PROOF" in
            *failure*|*cancelled*) exit 1 ;;
          esac
          case "$COVERAGE" in
            reuse) test "$SKIP" = true && test "$SHARDS" = skipped && test "$LIGHT" = skipped ;;
            light) test "$SKIP" = false && test "$LIGHT" = success && test "$SHARDS" = skipped ;;
            full) test "$LIGHT" = skipped && { test "$SHARDS" = success || { test "$HAS_SHARDS" = false && test "$SHARDS" = skipped; }; } ;;
            *) exit 1 ;;
          esac
